# Account context that telemetry cannot carry. Fictional. Visibility is per section and per
# item and is enforced by lodestar.risks / lodestar.audience models. Anything not explicitly
# tagged `visibility: customer` is internal-only (fail closed).

account:
  name: Northstar Retail Group
  segment: Strategic
  flagship_brand: Polaris
  deployment: northstar-flagship-support-ft-v1
  go_live_date: 2026-08-01
  contract_renewal_date: 2027-07-31          # internal
  current_arr_usd: 210000                    # internal
  fireworks_account_lead: A. Okafor          # internal
  fireworks_fde: R. Rana                     # internal

# --- Relationship pillar inputs (internal-only), 0-100, higher is better -------------------
relationship:
  executive_sponsor_engagement: 80   # VP CX sponsors; attends monthly
  champion_strength: 85              # CX platform lead drives adoption, shares data proactively
  stakeholder_coverage: 55           # VP Eng lightly engaged; no CFO contact; 3 of 4 brand GMs unmet
  renewal_outlook: 75                # renewal 11 months out; no signals of churn; budget owner unclear
  competitive_position: 60           # incumbent CCaaS bundling agent-assist; hyperscaler credits offered

stakeholders:                         # internal-only
  - {name: VP Customer Experience, role: Executive sponsor, coverage: strong, last_touch: 2026-08-28}
  - {name: VP Engineering, role: Technical approver, coverage: light, last_touch: 2026-08-12}
  - {name: CX platform lead, role: Champion, coverage: strong, last_touch: 2026-09-02}
  - {name: CFO / finance BP, role: Budget owner, coverage: none, last_touch: null}
  - {name: Kestrel Athletics GM, role: Expansion sponsor, coverage: medium, last_touch: 2026-08-20}
  - {name: Meridian Home ops director, role: Expansion gatekeeper, coverage: none, last_touch: null}

# --- Static risks (data-derived risks are generated in code and merged with these) ---------
risks:
  - id: R-REL-1
    title: Stakeholder coverage is thin beyond the CX organisation
    category: relationship
    severity: high
    likelihood: medium
    visibility: internal
    detail: >-
      Expansion needs VP Engineering, finance and four brand GMs. Today the relationship runs
      through CX. A budget conversation without a finance contact will stall.
    mitigation: Joint architecture review with VP Eng in September; ask sponsor for a finance intro at the EBR.
  - id: R-COMP-1
    title: Incumbent contact-center vendor is bundling agent-assist
    category: competitive
    severity: medium
    likelihood: medium
    visibility: internal
    detail: >-
      Bundled pricing and one-throat-to-choke appeal to Meridian and Lumen operations teams that
      have not seen the flagship results first-hand.
    mitigation: Put measured flagship results in front of brand GMs before their vendor renewals.
  - id: R-EXEC-1
    title: Four brands, four help-desk stacks, four operating teams
    category: execution
    severity: high
    likelihood: high
    visibility: customer
    detail: >-
      Each brand has its own tooling, tone, policy and team. Without a shared platform owner
      and a shared evaluation harness the rollout fragments into four bespoke bots.
    mitigation: Name a Northstar CX platform owner; use the shared-base plus brand-adapter architecture; prove the playbook on one pilot.
  - id: R-TECH-3
    title: Answer-safety policy for regulated product questions
    category: technical
    severity: medium
    likelihood: medium
    visibility: customer
    detail: Lumen Beauty questions touch allergens and usage; the flagship guardrails were not designed for this.
    mitigation: Design and evaluate answer-safety guardrails before any Lumen pilot.

